<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#ff2fd0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Fira Code','JetBrains Mono','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace; white-space: pre; }
      .p { fill:#2ea44f; } .path { fill:#36BCF7; } .cmd { fill:#e6edf3; }
      .k { fill:#36BCF7; font-weight:700; } .v { fill:#c9d1d9; } .dim { fill:#6e7681; }
      .ln { opacity:0; animation: show .25s ease-out forwards; }
      @keyframes show { from { opacity:0; transform: translateX(-6px) } to { opacity:1; transform: translateX(0) } }
      .type { animation: typing 1.1s steps(28) forwards; }
      @keyframes typing { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0 } }
      .borderAnim { stroke-dasharray: 320 2752; animation: dash 5s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -3072 } }
      .spin { transform-origin: 150px 185px; animation: rot 18s linear infinite; }
      .spinR { transform-origin: 150px 185px; animation: rot 10s linear infinite reverse; }
      .orbit { transform-origin: 150px 185px; animation: rot 4s linear infinite; }
      @keyframes rot { to { transform: rotate(360deg) } }
      .ok { fill:#2ea44f; } .gold { fill:#ffd36e; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }
    </style>
  </defs>

  <!-- window -->
  <rect x="6" y="6" width="988" height="548" rx="14" fill="url(#bg)"/>
  <rect x="6" y="6" width="988" height="548" rx="14" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <rect x="6" y="6" width="988" height="548" rx="14" fill="none" stroke="url(#border)" stroke-width="3" class="borderAnim" filter="url(#glow)"/>
  <rect x="6" y="6" width="988" height="40" rx="14" fill="#161b22"/>
  <rect x="6" y="32" width="988" height="14" fill="#161b22"/>
  <circle cx="34" cy="26" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="26" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="26" r="7" fill="#27c93f"/>
  <text x="500" y="31" text-anchor="middle" font-size="14" class="dim">suhas@kanwar: ~ — zsh — 120×36</text>

  <!-- command 1 -->
  <g font-size="16">
    <text x="30" y="80" class="ln" style="animation-delay:.2s"><tspan class="p">➜ </tspan><tspan class="path">~ </tspan></text>
    <text x="78" y="80" class="cmd type" style="clip-path: inset(0 100% 0 0); animation-delay:.4s">neofetch --user suhas</text>
  </g>

  <!-- monogram -->
  <g class="ln" style="animation-delay:1.6s">
    <g class="spin">
      <circle cx="150" cy="185" r="92" fill="none" stroke="url(#logo)" stroke-width="2" stroke-dasharray="4 10" opacity=".7"/>
    </g>
    <g class="spinR">
      <circle cx="150" cy="185" r="78" fill="none" stroke="#36BCF7" stroke-width="1.5" stroke-dasharray="60 30 10 30" opacity=".6"/>
    </g>
    <polygon points="150,120 206,152 206,218 150,250 94,218 94,152" fill="#0d1117" stroke="url(#logo)" stroke-width="3" filter="url(#glow)"/>
    <text x="150" y="203" text-anchor="middle" font-size="52" font-weight="800" fill="url(#logo)" filter="url(#glow)" letter-spacing="2">SK</text>
    <circle cx="150" cy="93" r="4" fill="#36BCF7" class="orbit"/>
  </g>
  <g font-size="13" class="dim">
    <text x="150" y="312" text-anchor="middle" class="ln" style="animation-delay:2.2s">// building the future,</text>
    <text x="150" y="332" text-anchor="middle" class="ln" style="animation-delay:2.3s">// one commit at a time</text>
  </g>

  <!-- info -->
  <g font-size="15">
    <text x="330" y="116" class="ln" style="animation-delay:2.4s"><tspan class="k">suhas</tspan><tspan class="v">@</tspan><tspan class="k">kanwar</tspan></text>
    <text x="330" y="136" class="ln dim" style="animation-delay:2.5s">──────────────────────────────────────────────</text>
    <text x="330" y="160" class="ln" style="animation-delay:2.6s"><tspan class="k">Role      </tspan><tspan class="v">SDE · AI/ML Engineer · Full-Stack</tspan></text>
    <text x="330" y="184" class="ln" style="animation-delay:2.7s"><tspan class="k">Education </tspan><tspan class="v">B.Tech CSE @ BML Munjal University</tspan></text>
    <text x="330" y="208" class="ln" style="animation-delay:2.8s"><tspan class="k">CGPA      </tspan><tspan class="gold">9.09 / 10</tspan></text>
    <text x="330" y="232" class="ln" style="animation-delay:2.9s"><tspan class="k">Languages </tspan><tspan class="v">Python · TypeScript · C++ · Rust · Solidity</tspan></text>
    <text x="330" y="256" class="ln" style="animation-delay:3.0s"><tspan class="k">Web       </tspan><tspan class="v">Next.js · React · FastAPI · Django · Hono</tspan></text>
    <text x="330" y="280" class="ln" style="animation-delay:3.1s"><tspan class="k">AI        </tspan><tspan class="v">Agentic AI · RAG · LLMs · Computer Vision</tspan></text>
    <text x="330" y="304" class="ln" style="animation-delay:3.2s"><tspan class="k">Infra     </tspan><tspan class="v">AWS · Azure · Docker · K8s · Kafka · Redis</tspan></text>
    <text x="330" y="328" class="ln" style="animation-delay:3.3s"><tspan class="k">Web3      </tspan><tspan class="v">Solidity · Smart Contracts · IPFS</tspan></text>
    <text x="330" y="352" class="ln" style="animation-delay:3.4s"><tspan class="k">Trophies  </tspan><tspan class="gold">3× 1st · 2× 2nd · 2× 3rd-tier finishes</tspan></text>
    <text x="330" y="376" class="ln" style="animation-delay:3.5s"><tspan class="k">Status    </tspan><tspan class="ok pulse">● </tspan><tspan class="ok">Open to opportunities</tspan></text>
  </g>
  <!-- colour blocks -->
  <g class="ln" style="animation-delay:3.6s">
    <rect x="330" y="394" width="30" height="16" fill="#0d1117" stroke="#30363d"/>
    <rect x="360" y="394" width="30" height="16" fill="#ff5f56"/>
    <rect x="390" y="394" width="30" height="16" fill="#27c93f"/>
    <rect x="420" y="394" width="30" height="16" fill="#ffbd2e"/>
    <rect x="450" y="394" width="30" height="16" fill="#36BCF7"/>
    <rect x="480" y="394" width="30" height="16" fill="#8a2be2"/>
    <rect x="510" y="394" width="30" height="16" fill="#ff2fd0"/>
    <rect x="540" y="394" width="30" height="16" fill="#e6edf3"/>
  </g>

  <!-- command 2 -->
  <g font-size="16">
    <text x="30" y="452" class="ln" style="animation-delay:3.9s"><tspan class="p">➜ </tspan><tspan class="path">~ </tspan></text>
    <text x="78" y="452" class="cmd type" style="clip-path: inset(0 100% 0 0); animation-delay:4.1s">cat mission.txt</text>
    <text x="30" y="482" font-size="15" class="ln" style="animation-delay:5.3s"><tspan class="v">Building intelligent, scalable systems — from autonomous AI agents</tspan></text>
    <text x="30" y="504" font-size="15" class="ln" style="animation-delay:5.5s"><tspan class="v">and RAG pipelines to cloud-native backends and on-chain apps.</tspan></text>
    <text x="30" y="536" class="ln" style="animation-delay:5.8s"><tspan class="p">➜ </tspan><tspan class="path">~ </tspan><tspan class="cmd cursor">█</tspan></text>
  </g>
</svg>
